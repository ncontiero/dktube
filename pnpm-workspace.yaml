minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExcludePrune: true
trustPolicyExclude:
  - prisma@7.10.1
shellEmulator: true

allowBuilds:
  "@clerk/shared": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
